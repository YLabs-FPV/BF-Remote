[tools]
node = "22.23.2"
pnpm = "11.10.0"

[env]

_.file = ".env"

[tasks.server]
description = "Run the Worker + Durable Object locally (wrangler dev on :8787)"
shell = "cmd /c"
run = "pnpm -C server dev"

[tasks.web]
description = "Run the Vite dev server for the share page with HMR (:5173)"
shell = "cmd /c"
run = "pnpm -C web dev"

[tasks.dev]
description = "Run the Worker and the share page together"
depends = ["server", "web"]
